<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayush Patel | Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Ayush Patel</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="creative.html">Creative Work</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>Contact Me</h1>
      <p>Feel free to reach out.</p>
    </section>

    <section class="card">
      <h2>Email</h2>
      <p>You can contact me directly by email:</p>
      <p>
        <a class="button" href="mailto:youremail@example.com">Send Me an Email</a>
      </p>
    </section>

    <section class="card">
      <h2>Message Form</h2>
      <p>This form is a simple static contact layout for the site design.</p>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your email" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Your message"></textarea>

        <button type="submit" class="button">Submit</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Ayush Patel</p>
  </footer>
</body>
</html>
